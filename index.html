<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AX Marketing</title>
<meta name="description" content="Contact AX Marketing on Telegram for details and guidance.">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 50% 10%,#17275a 0,#090e27 45%,#050817 100%);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
main{width:min(560px,92%);text-align:center}
.logo{
  width:76px;height:76px;margin:0 auto 18px;
  border-radius:22px;display:grid;place-items:center;
  background:#101a3d;border:1px solid #395487;
  box-shadow:0 18px 45px #0008;
  font-size:27px;font-weight:950;color:#2cddff;
}
.brand{font-size:32px;font-weight:950;letter-spacing:-1.5px;margin-bottom:24px}
.brand span{
  background:linear-gradient(90deg,#27dcff,#8d6dff,#e95fcf);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-size:clamp(30px,8vw,43px);line-height:1.15;letter-spacing:-1.5px;margin:0 0 25px}
.highlight{
  background:linear-gradient(90deg,#29ddff,#9b71ff,#ec62d3);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.telegram{
  display:block;padding:17px 20px;border-radius:999px;
  background:linear-gradient(100deg,#16cce8,#596cff,#d956cb);
  color:#fff;text-decoration:none;font-size:18px;font-weight:900;
  box-shadow:0 0 32px #576cff4d;
}
.timer{margin-top:13px;color:#aab5ce;font-size:13px}
.bar{height:5px;margin-top:9px;background:#27314d;border-radius:99px;overflow:hidden}
.bar i{
  display:block;width:100%;height:100%;
  background:linear-gradient(90deg,#29ddff,#9b71ff,#ec62d3);
  animation:go 12s linear forwards;
}
@keyframes go{to{width:0}}
.whatsapp{
  display:inline-block;margin-top:28px;color:#49e1a8;
  font-size:12px;text-decoration:none;border-bottom:1px solid #49e1a866;
}
.ads{margin-top:8px;color:#7f8ba6;font-size:11px}
</style>
</head>
<body>
<main>
  <div class="logo">AX↗</div>
  <div class="brand">AX <span>Marketing</span></div>

  <h1>Message us on <span class="highlight">Telegram</span><br>for details &amp; guidance</h1>

  <a class="telegram" href="https://t.me/Axev78" target="_blank" rel="noopener">✈️ Message on Telegram</a>

  <div class="timer" id="timer">Redirecting to Telegram in 12 seconds
    <div class="bar"><i></i></div>
  </div>

  <a class="whatsapp" href="https://wa.me/qr/WIT34NJZ6RZON1" target="_blank" rel="noopener">WhatsApp Chat</a>
  <div class="ads">Ads by AX Marketing</div>
</main>

<script>
let n=12, el=document.getElementById("timer");
let t=setInterval(()=>{
  n--;
  el.firstChild.textContent=n>0
    ? "Redirecting to Telegram in "+n+" seconds "
    : "Opening Telegram… ";
  if(n<=0){
    clearInterval(t);
    window.location.href="https://t.me/Axev78";
  }
},1000);
</script>
</body>
</html>
